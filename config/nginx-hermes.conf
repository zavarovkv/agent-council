map $http_upgrade $hermes_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name hermes.2.29.13.129.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hermes-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://hermes.2.29.13.129.sslip.io$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hermes.2.29.13.129.sslip.io;

    ssl_certificate /etc/hermes/letsencrypt/live/hermes.2.29.13.129.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/hermes/letsencrypt/live/hermes.2.29.13.129.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/hermes-access.log;
    error_log /var/log/nginx/hermes-error.log;
    client_max_body_size 16m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    error_page 503 /__hermes_setup_pending;
    location = /__hermes_setup_pending {
        internal;
        alias /var/www/hermes-status/setup-pending.html;
        types { }
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        # Only gate browser/login pages here. Private APIs retain Hermes' 401.
        set $hermes_setup_pending 0;
        if (-f /var/www/hermes-status/setup-pending) { set $hermes_setup_pending 1; }
        if ($uri ~ "^/(api|assets)/") { set $hermes_setup_pending 0; }
        if ($hermes_setup_pending = 1) { return 503; }
        proxy_pass http://127.0.0.1:9119;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hermes_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
