map $http_upgrade $council_connection_upgrade {
    default upgrade;
    '' close;
}

map $uri $council_robots {
    default "noindex, nofollow";
    / "index, follow, max-image-preview:large";
    /login "index, follow, max-image-preview:large";
    /robots.txt "";
    /sitemap.xml "";
    ~^/auth/login/council/avatars/ "index, follow";
}

server {
    listen 80;
    listen [::]:80;
    server_name council.zavarov.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hermes-acme;
        try_files $uri =404;
    }
    location / { return 301 https://council.zavarov.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name council.zavarov.com;
    ssl_certificate /etc/hermes/letsencrypt/live/council.zavarov.com/fullchain.pem;
    ssl_certificate_key /etc/hermes/letsencrypt/live/council.zavarov.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/council-access.log;
    error_log /var/log/nginx/council-error.log;
    client_max_body_size 16m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag $council_robots always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /api/\nDisallow: /integrations/\nDisallow: /auth/\nAllow: /auth/login/council/avatars/\nSitemap: https://council.zavarov.com/sitemap.xml\n";
    }
    location = /sitemap.xml {
        default_type application/xml;
        return 200 '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>https://council.zavarov.com/</loc></url></urlset>';
    }
    # The static public landing is built from zavarov.com and staged locally.
    # All authenticated routes remain proxied to Hermes on this same origin.
    location = / {
        root /var/www/agent-council-landing;
        try_files /index.html =503;
    }
    location ^~ /council/ {
        root /var/www/agent-council-landing;
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600";
    }

    error_page 503 /__hermes_setup_pending;
    # Preserve application responses and setup handling. Only origin transport
    # failures become a retryable maintenance response, with no edge 502 page.
    error_page 502 504 =503 @council_unavailable;
    location @council_unavailable {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "30" always;
        add_header X-Content-Type-Options nosniff always;
        return 503 "Agent Council временно недоступен. Подождите немного и обновите страницу.\n";
    }
    location = /__hermes_setup_pending {
        internal;
        alias /var/www/hermes-status/setup-pending.html;
        types { }
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    # OAuth callback codes and webhook bodies must not enter either access or error logs.
    location ^~ /integrations/linear/ {
        access_log off;
        error_log /dev/null crit;
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:9121;
        proxy_intercept_errors on;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 30s;
    }
    location / {
        set $council_setup_pending 0;
        if (-f /var/www/hermes-status/setup-pending) { set $council_setup_pending 1; }
        if ($uri ~ "^/(api|assets)/") { set $council_setup_pending 0; }
        if ($council_setup_pending = 1) { return 503; }
        proxy_pass http://127.0.0.1:9119;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $council_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
