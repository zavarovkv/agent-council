# Keep the original hostname as an HTTPS redirect and renew its certificate.
server {
    listen 80;
    listen [::]:80;
    server_name hermes.2.29.13.129.sslip.io;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hermes-acme;
        try_files $uri =404;
    }
    location / { return 308 https://council.zavarov.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hermes.2.29.13.129.sslip.io;
    ssl_certificate /etc/hermes/letsencrypt/live/hermes.2.29.13.129.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/hermes/letsencrypt/live/hermes.2.29.13.129.sslip.io/privkey.pem;
    location / { return 308 https://council.zavarov.com$request_uri; }
}
