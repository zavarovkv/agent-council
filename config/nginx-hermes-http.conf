# Initial ACME-only virtual host. Existing virtual hosts remain untouched.
server {
    listen 80;
    listen [::]:80;
    server_name hermes.2.29.13.129.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hermes-acme;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
