name: Bug report
description: Report a reproducible non-security problem.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For vulnerabilities, use the private link in SECURITY.md. Never include secrets or personal data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the commit or image digest, OS, and Docker/Compose versions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Remove tokens, OAuth codes, credentials, account identifiers and private content.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I checked that this report contains no credentials or private user data.
          required: true
