name: Public health

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-health
  cancel-in-progress: true

jobs:
  availability:
    if: vars.COUNCIL_MONITOR_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HERMES_LIVE_URL: ${{ vars.COUNCIL_MONITOR_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Check public HTTPS and the anonymous auth boundary
        run: python -m unittest discover -s tests -p test_deployment_http.py -v
