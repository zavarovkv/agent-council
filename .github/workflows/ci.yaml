name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: make test lint

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: bash scripts/check-infrastructure.sh
      - run: docker build --check .
      - run: sudo apt-get update && sudo apt-get install --yes nginx
      - run: make test-nginx

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Verify the real pinned OIDC adapter offline
        run: make test-integration
      - name: Verify encrypted backups and real profile recovery offline
        run: make test-backups
      - name: Verify the isolated secretary service offline
        run: make test-secretary
      - name: Rehearse recovery on this disposable replacement host
        run: sudo env GITHUB_ACTIONS=true COUNCIL_RECOVERY_DRILL=fixture-only python3 scripts/check-recovery-host.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify the official SDK popup and callback contract
        run: make test-browser
