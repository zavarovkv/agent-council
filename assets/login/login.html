<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script defer src="https://oauth.telegram.org/js/telegram-login.js?6"></script>
  <title>Вход — Agent Council</title>
  <style>$STYLES</style>
</head>
<body>
  <header>
    <nav aria-label="Вход">
      <strong>Agent Council.</strong>
      <div class="provider-list">
$PROVIDER_BUTTONS
      </div>
      <div class="telegram-widget" hidden>
        <button class="tg-auth-button not-beauty" type="button" disabled
          aria-label="Войти через Telegram"><span>Войти через Telegram</span></button>
      </div>
    </nav>
  </header>
  <main>
    <section aria-labelledby="login-title">
      <h1 id="login-title">С возвращением.</h1>
      <p>Войдите, чтобы продолжить работу с агентами и рабочими сессиями.</p>
      <p class="login-status" role="status" hidden></p>
    </section>
  </main>
$PASSWORD_SCRIPT
$WIDGET_SCRIPT
</body>
</html>
