<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script defer src="https://oauth.telegram.org/js/telegram-login.js?6"></script>
  <title>Команда — Agent Council</title>
  <style>$STYLES</style>
</head>
<body>
  <header>
    <nav aria-label="Вход">
      <strong>Agent Council.</strong>
      <div class="beauty-nav-end">
        <div class="provider-list">
$PROVIDER_BUTTONS
        </div>
        <div class="telegram-widget" hidden>
          <button class="tg-auth-button not-beauty" type="button" disabled
            aria-label="Войти через Telegram"><span>Войти через Telegram</span></button>
        </div>
      </div>
    </nav>
  </header>
  <main>
    <section aria-labelledby="login-title">
      <h1 id="login-title">Совет агентов.</h1>
      <p>ИИ-ассистенты для исследований, продвижения, редактуры и работы с задачами.</p>
      <p>Квай-Гон координирует работу Декстера, Лэндо и Падме. Каждый отвечает за свою специализацию.</p>
      <p class="login-status" role="status" hidden></p>
    </section>
    <section aria-label="Состав команды">
$TEAM_MEMBERS
    </section>
    <p data-team-status role="status"></p>
    <noscript><p>Для загрузки статистики и портретов включите JavaScript. Вход по ссылке в шапке остаётся доступен.</p></noscript>
  </main>
$PASSWORD_SCRIPT
$WIDGET_SCRIPT
$TEAM_SCRIPT
</body>
</html>
