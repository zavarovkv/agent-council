<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Hermes — личный доступ</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #101411; color: #eef4ec; }
      main { margin: 24px; padding: 40px; max-width: 420px; border: 1px solid #354238; border-radius: 20px; background: #19201b; }
      .brand { color: #b9db9d; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; }
      h1 { font-size: 30px; line-height: 1.15; margin: 24px 0 16px; font-weight: 600; }
      p { color: #b7c1b9; line-height: 1.65; }
      a { display: inline-block; margin-top: 16px; border-radius: 10px; padding: 12px 18px; color: #152010; background: #b9db9d; text-decoration: none; font-weight: 600; }
      small { display: block; margin-top: 28px; color: #839087; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Hermes · Личный доступ</div>
      <h1>Вход скоро будет доступен</h1>
      <p>Владелец завершает настройку авторизации через Telegram. Пока доступ к рабочему пространству закрыт.</p>
      <a href="/">Обновить страницу</a>
      <small>Войти сможет только владелец.</small>
    </main>
  </body>
</html>
